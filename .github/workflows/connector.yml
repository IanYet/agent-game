name: Build and release connectors

# Deliberate manual baseline builds; publishing games never rebuilds a connector.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 Release；不勾选时仅构建并上传产物'
        type: boolean
        required: true
        default: false
      build_run_id:
        description: '复用已完成构建的运行 ID；留空则重新构建'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: connector-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.build_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: 同桌连接器-Windows-64位
            asset: TongZhuo-Connector-Windows-x64.exe
          - os: macos-15
            platform: macos
            arch: arm64
            artifact: 同桌连接器-macOS-Apple-Silicon
            asset: TongZhuo-Connector-macOS-Apple-Silicon.zip
          - os: macos-15-intel
            platform: macos
            arch: x64
            artifact: 同桌连接器-macOS-Intel
            asset: TongZhuo-Connector-macOS-Intel.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Select a stable Xcode with the current macOS UI SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, appendFile, access } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const candidates = (await readdir('/Applications')).flatMap(name => {
            const match = /^Xcode_(\d+(?:\.\d+)*)\.app$/.exec(name);
            return match && Number(match[1].split('.')[0]) >= 26 ? [{ name, parts: match[1].split('.').map(Number) }] : [];
          }).sort((a, b) => {
            for (let i = 0; i < Math.max(a.parts.length, b.parts.length); i++) {
              const difference = (b.parts[i] ?? 0) - (a.parts[i] ?? 0);
              if (difference) return difference;
            }
            return a.name.localeCompare(b.name);
          });
          if (!candidates.length) throw new Error('This runner needs stable Xcode 26 or newer.');
          const developer = `/Applications/${candidates[0].name}/Contents/Developer`;
          await access(developer);
          await appendFile(process.env.GITHUB_ENV, `DEVELOPER_DIR=${developer}\n`);
          const env = { ...process.env, DEVELOPER_DIR: developer };
          execFileSync('/usr/bin/xcodebuild', ['-version'], { env, stdio: 'inherit' });
          execFileSync('/usr/bin/xcrun', ['--sdk', 'macosx', '--show-sdk-version'], { env, stdio: 'inherit' });
          NODE
      - run: npm ci
      - name: Set up .NET for the native Windows launcher
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run game rule tests
        if: matrix.os != 'macos-15-intel'
        run: npm test
      - name: Run game rule tests without worker contention on Intel
        if: matrix.os == 'macos-15-intel'
        run: npm test -- --maxWorkers=1
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm run build:connector
      - name: Package native connector with embedded Node
        run: npm run package:${{ matrix.platform }}
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
      - name: Upload connector package and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.asset }}*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ !cancelled() && inputs.publish_release && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.build_run_id != '')) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: 同桌连接器-*
          path: release-input
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Collect platform packages and checksums
        run: |
          mkdir release-assets
          find release-input -type f -name 'TongZhuo-Connector-*' -exec cp '{}' release-assets/ \;
      - name: Publish and verify Release assets without moving existing tags
        run: node scripts/publish-connector.mjs release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTOR_BUILD_RUN_ID: ${{ inputs.build_run_id || github.run_id }}
