name: Deploy static game website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build static website
        run: npm run build:web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_CONNECTOR_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/TongZhuo-Connector-Windows-x64.exe
          VITE_CONNECTOR_MACOS_ARM64_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/TongZhuo-Connector-macOS-Apple-Silicon.zip
          VITE_CONNECTOR_MACOS_X64_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/TongZhuo-Connector-macOS-Intel.zip
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
